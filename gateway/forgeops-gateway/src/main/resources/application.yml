server:
  port: 8080

spring:
  application:
    name: forgeops-gateway
  datasource:
    url: ${FORGEOPS_DB_URL:jdbc:postgresql://172.16.65.59:5432/forgeops_v2}
    username: ${FORGEOPS_DB_USER:forgeops}
    password: ${FORGEOPS_DB_PASSWORD:forgeops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

forgeops:
  v2:
    # 2.0 只使用新数据库；不读取 V0.1 表或历史回调。
    enabled: true

logging:
  level:
    com.company.forgeops: INFO
