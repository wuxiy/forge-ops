server:
  port: 8080

spring:
  application:
    name: forgeops-gateway
  datasource:
    url: ${FORGEOPS_DB_URL:jdbc:postgresql://172.16.65.59:5432/forgeops_v2}
    username: ${FORGEOPS_DB_USER:forgeops}
    password: ${FORGEOPS_DB_PASSWORD:forgeops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

forgeops:
  v2:
    # 2.0 只使用新数据库；不读取 V0.1 表或历史回调。
    enabled: true
    runtime:
      base-url: ${FORGEOPS_RUNTIME_URL:}
      service-token: ${FORGEOPS_RUNTIME_SERVICE_TOKEN:}
    github:
      enabled: ${FORGEOPS_V2_GITHUB_ENABLED:false}
      webhook-secret: ${FORGEOPS_V2_GITHUB_WEBHOOK_SECRET:}
      api-base-url: ${FORGEOPS_V2_GITHUB_API_BASE_URL:https://api.github.com}
      api-token: ${FORGEOPS_V2_GITHUB_API_TOKEN:}

logging:
  level:
    com.company.forgeops: INFO
